plugins {
    id("com.android.application") version "9.1.0"
}

android {
    namespace "dev.appstudio.starter"
    compileSdk 36

    defaultConfig {
        applicationId "__APP_ID__"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
